name: CI

on:
  push:
    branches:
      # No 'v*' branch pattern: releases ride version TAGS (release.yml),
      # and a v*-named branch should never be mistaken for one.
      - main
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'tsdown.config.ts'
      - 'tsconfig.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'lib/**'
      - 'cordis.patch.yml'
      - '.github/workflows/ci.yml'
      - '.github/workflows/release.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'tsdown.config.ts'
      - 'tsconfig.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'lib/**'
      - 'cordis.patch.yml'
      - '.github/workflows/ci.yml'
      - '.github/workflows/release.yml'

# Cancel a superseded run when a newer push lands on the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # pnpm version comes from the packageManager field in package.json only
      # (a "version" input alongside packageManager is a hard error in
      # pnpm/action-setup).
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # Pure-function regression needs Node >= 23.6 native TS type stripping;
      # pinned to 24, the line the check was verified on.
      - run: pnpm check:parse
      # Real-git fixture integration (repositories under .tmp-check-git/).
      - run: pnpm check:git
      # Compilers-blind consistency (css refs, dynamic locale keys,
      # manifest, prefs/schema lock, dispatch coverage).
      - run: pnpm check:meta
      - run: pnpm build
      # lib/ is committed so the tab runs without build rights; a source
      # change without a rebuilt lib would ship stale artifacts. All bundled
      # modules resolve inside the project with lockfile-pinned versions, so
      # the build is byte-stable across machines and this diff must be empty.
      - run: git diff --exit-code -- lib/
