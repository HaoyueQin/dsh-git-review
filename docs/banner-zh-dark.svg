<rect x="48" y="154" width="170" height="30" rx="15" fill="#161b22" stroke="#30363d"/>
<circle cx="68" cy="169" r="5" fill="#58a6ff"/>
<text x="80" y="173">任意两 ref 三点对比</text>
<rect x="226" y="154" width="240" height="30" rx="15" fill="#161b22" stroke="#30363d"/>
<circle cx="246" cy="169" r="5" fill="#3fb950"/>
<text x="258" y="173">文件名 · 差异 · 内容三范围搜索</text>
<rect x="474" y="154" width="160" height="30" rx="15" fill="#161b22" stroke="#30363d"/>
<circle cx="494" cy="169" r="5" fill="#bc8cff"/>
<text x="506" y="173">两段确认的写操作</text>
</g>
<text x="48" y="216" font-size="12" fill="#8b949e">文件树 · 双列差异 · 泳道图谱 · 追溯 · 贮藏 · 标签</text>
<g>
<rect x="756" y="34" width="396" height="192" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
<circle cx="780" cy="58" r="5" fill="#ff5f57"/>
<circle cx="796" cy="58" r="5" fill="#febc2e"/>
<circle cx="812" cy="58" r="5" fill="#28c840"/>
<text x="828" y="62" font-size="12" fill="#8b949e">审查 · 工作树 vs HEAD</text>
<text x="1136" y="62" font-size="12" font-weight="700" text-anchor="end"><tspan fill="#3fb950">+128</tspan><tspan fill="#f0f6fc"> </tspan><tspan fill="#f85149">−42</tspan></text>
<line x1="756" y1="74" x2="1152" y2="74" stroke="#30363d"/>
<g font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11">
<rect x="772" y="84" width="364" height="20" rx="4" fill="#3c1a1d"/>
<text x="780" y="98" fill="#ffb1a8">- const base = await diffBase(root)</text>
<rect x="772" y="108" width="364" height="20" rx="4" fill="#122b1c"/>
<text x="780" y="122" fill="#7ee787">+ const { base } = await diffBase(root, range)</text>
<rect x="772" y="132" width="364" height="20" rx="4" fill="#0d1117"/>
<text x="780" y="146" fill="#8b949e">  return { ok: true, base }</text>
</g>
<line x1="782" y1="192" x2="1052" y2="192" stroke="#58a6ff" stroke-width="2.5"/>
