<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" role="img" aria-label="DSH Git Review">
<title>DSH Git Review</title>
<defs>
<linearGradient id="bbgzd" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#161b22"/>
<stop offset="1" stop-color="#0d1117"/>
</linearGradient>
</defs>
<rect x="0" y="0" width="1200" height="260" fill="url(#bbgzd)"/>
<rect x="0" y="0" width="6" height="260" fill="#58a6ff"/>
<text x="48" y="54" font-size="13" letter-spacing="3" fill="#8b949e">DEEPSEEK HARNESS 插件</text>
<text x="46" y="104" font-size="46" font-weight="700" fill="#f0f6fc">DSH Git Review</text>
<text x="48" y="136" font-size="14" fill="#9aa4b2">看清 agent 改了什么再行动——差异、图谱与设防的 Git 操作，同处一个标签页。</text>
