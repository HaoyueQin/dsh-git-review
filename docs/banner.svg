<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" role="img" aria-label="DSH Git Review">
<title>DSH Git Review</title>
<defs>
<linearGradient id="bbg" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#fbfcfe"/>
<stop offset="1" stop-color="#edf0f5"/>
</linearGradient>
</defs>
<rect x="0" y="0" width="1200" height="260" fill="url(#bbg)"/>
<rect x="0" y="0" width="6" height="260" fill="#0969da"/>
<text x="48" y="54" font-size="13" letter-spacing="3" fill="#57606a">DEEPSEEK HARNESS PLUGIN</text>
<text x="46" y="104" font-size="46" font-weight="700" fill="#0f172a">DSH Git Review</text>
<text x="48" y="136" font-size="15" fill="#424a53">Review what the agent changed, then act — diff, graph and guarded git writes in one tab.</text>
<g font-size="13" fill="#24292f">
<rect x="48" y="154" width="264" height="30" rx="15" fill="#ffffff" stroke="#d0d7de"/>
<circle cx="68" cy="169" r="5" fill="#0969da"/>
<text x="80" y="173">three-dot compare across any refs</text>
<rect x="320" y="154" width="240" height="30" rx="15" fill="#ffffff" stroke="#d0d7de"/>
<circle cx="340" cy="169" r="5" fill="#1a7f37"/>
<text x="352" y="173">search names · diffs · content</text>
<rect x="568" y="154" width="154" height="30" rx="15" fill="#ffffff" stroke="#d0d7de"/>
<circle cx="588" cy="169" r="5" fill="#8250df"/>
<text x="600" y="173">guarded git writes</text>
</g>
<text x="48" y="216" font-size="12" fill="#6e7781">file tree · side-by-side diff · lane graph · blame · stash · tags</text>
<g>
<rect x="756" y="34" width="396" height="192" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
<circle cx="780" cy="58" r="5" fill="#ff5f57"/>
<circle cx="796" cy="58" r="5" fill="#febc2e"/>
<circle cx="812" cy="58" r="5" fill="#28c840"/>
<text x="828" y="62" font-size="12" fill="#57606a">Review · worktree vs HEAD</text>
<text x="1136" y="62" font-size="12" font-weight="700" text-anchor="end"><tspan fill="#1a7f37">+128</tspan><tspan fill="#24292f"> </tspan><tspan fill="#d1242f">−42</tspan></text>
<line x1="756" y1="74" x2="1152" y2="74" stroke="#d0d7de"/>
<g font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11">
<rect x="772" y="84" width="364" height="20" rx="4" fill="#ffebe9"/>
<text x="780" y="98" fill="#82071e">- const base = await diffBase(root)</text>
<rect x="772" y="108" width="364" height="20" rx="4" fill="#dafbe1"/>
<text x="780" y="122" fill="#116329">+ const { base } = await diffBase(root, range)</text>
<rect x="772" y="132" width="364" height="20" rx="4" fill="#f6f8fa"/>
<text x="780" y="146" fill="#57606a">  return { ok: true, base }</text>
</g>
<line x1="782" y1="192" x2="1052" y2="192" stroke="#0969da" stroke-width="2.5"/>
<path d="M870 192 C 890 192 895 176 915 176 L955 176 C 975 176 980 192 1000 192" fill="none" stroke="#8250df" stroke-width="2.5"/>
<circle cx="810" cy="192" r="4" fill="#0969da"/>
<circle cx="870" cy="192" r="4" fill="#0969da"/>
<circle cx="935" cy="176" r="4" fill="#8250df"/>
<circle cx="1000" cy="192" r="4.5" fill="#ffffff" stroke="#0969da" stroke-width="2.5"/>
<circle cx="1040" cy="192" r="4" fill="#0969da"/>
<text x="1124" y="180" font-size="11" fill="#6e7781" text-anchor="end">graph</text>
</g>
</svg>
